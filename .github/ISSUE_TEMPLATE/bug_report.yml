name: Bug report
description: Something in the It's mono, yo! app or on its website is broken or behaves unexpectedly.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check that you're on the latest version from the [Mac App Store](https://apps.apple.com/app/its-mono-yo/id6758866918?mt=12) first.
        For a security vulnerability, **don't open a public issue**. See [SECURITY.md](https://github.com/JarlLyng/It-s-mono-yo-/blob/main/SECURITY.md) for how to report it privately.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line on what's wrong.
      placeholder: 'A 24-bit AIFF comes out silent after converting'
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Mac app
        - Website (itsmonoyo.iamjarl.com)
        - Both
        - Other / unsure
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: From the app menu, "About It's mono, yo!". Leave blank if the bug is on the website.
      placeholder: '1.4.6'

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: From the Apple menu, "About This Mac".
      placeholder: 'macOS 26.1'

  - type: input
    id: mac
    attributes:
      label: Mac
      description: The model, or at least Apple silicon or Intel.
      placeholder: 'MacBook Air M2'

  - type: input
    id: file
    attributes:
      label: The file, if it's about a conversion
      description: Format, sample rate, bit depth and channels of the file you put in, and the settings you converted with.
      placeholder: 'WAV, 48 kHz, 24-bit, stereo. Converted to WAV, 44.1 kHz, 16-bit'

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that show the bug. A numbered list is fine.
      placeholder: |
        1. Drag a folder of stereo WAV files onto the window
        2. Set 24-bit and keep the original sample rate
        3. Click Convert
        4. Open the converted file
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or a screen recording (optional)
      description: Drag images or short clips in here. If a file converts wrongly, a short sample of it helps too, if you're happy to share it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find a duplicate
          required: true
        - label: This is a public bug report (security issues go through SECURITY.md)
          required: true
